# One-shot relay: pg_dump the Render Postgres and pg_restore it into Neon.
# Exists because the expiring Render free DB must be evacuated and the local
# network blocks outbound TLS on 5432 — GitHub's runners don't.
#
# Manual trigger only (Actions tab → "DB migrate: Render → Neon" → Run workflow).
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   RENDER_DB_URL — Render "External Database URL" + ?sslmode=require
#   NEON_DB_URL   — Neon DIRECT (non-pooler) connection string for the target db
# The dump lives only on the ephemeral runner; no artifacts are uploaded, and
# GitHub masks the secret values in logs. Delete this file after the migration.

name: "DB migrate: Render -> Neon"

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Postgres client version
        run: pg_dump --version

      - name: Dump source (Render)
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          pg_dump --no-owner --no-privileges -Fc -f /tmp/db.dump "$RENDER_DB_URL"
          ls -l /tmp/db.dump

      - name: Row counts — source
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
        run: |
          for t in $(psql "$RENDER_DB_URL" -Atc "select tablename from pg_tables where schemaname='public' order by 1"); do
            printf '%-24s %s\n' "$t" "$(psql "$RENDER_DB_URL" -Atc "select count(*) from \"$t\"")"
          done

      - name: Restore into target (Neon)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          pg_restore --no-owner --no-privileges --clean --if-exists -d "$NEON_DB_URL" /tmp/db.dump

      - name: Row counts — target
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          for t in $(psql "$NEON_DB_URL" -Atc "select tablename from pg_tables where schemaname='public' order by 1"); do
            printf '%-24s %s\n' "$t" "$(psql "$NEON_DB_URL" -Atc "select count(*) from \"$t\"")"
          done
